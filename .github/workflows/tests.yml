name: Tests

# NO `paths` FILTER, DELIBERATELY. This is the required check on main, and a
# required check that is skipped never reports, so GitHub waits for it forever.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          # The version the image ships (Dockerfile FROM).
          python-version: '3.14'

      - name: Install the package and its test dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -q
