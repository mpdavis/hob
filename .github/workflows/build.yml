name: Build Image

# Builds this repo into ghcr.io/mpdavis/hob, deployed from docker/infra/hob/ in
# mpdavis/homelab, whose Renovate bumps the pinned tag.
#
# ONLY main PUBLISHES. Renovate picks bumps from the registry's tag list, which
# carries no provenance, so any tag pushed here is a tag the infra host can end
# up running. Pull requests build without pushing so a broken Dockerfile fails
# the PR rather than main.
#
# Tags are 1.0.<run_number>, not 0.x: Renovate treats every 0.x minor bump as a
# breaking change, and homelab holds those for dashboard approval.

on:
  push:
    branches: [main]
    paths: &image-paths
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'README.md'
      - 'hob/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths: *image-paths
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ghcr.io/mpdavis/hob:1.0.${{ github.run_number }}
            ghcr.io/mpdavis/hob:latest
